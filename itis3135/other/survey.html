<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gecko Survey</title>
  <link rel="stylesheet" href="styles/default.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

  <div data-include="components/header.html"></div>

  <main>
    <h2>Gecko Survey</h2>

    <p id="description">Help us improve gecko care! Please complete this short survey.</p>

    <form id="survey-form">

      <label id="name-label" for="name">Full Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>

      <br><br>

      <label id="email-label" for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <br><br>

      <label id="number-label" for="number">Years Owning Geckos:</label>
      <input type="number" id="number" name="number" placeholder="Enter years" min="0" max="50">

      <br><br>

      <label for="dropdown">Favorite Gecko Type:</label>
      <select id="dropdown" name="gecko-type">
        <option value="leopard">Leopard Gecko</option>
        <option value="crested">Crested Gecko</option>
        <option value="tokay">Tokay Gecko</option>
      </select>

      <br><br>

      <p>Preferred Setup:</p>
      <input type="radio" id="simple" name="setup" value="simple">
      <label for="simple">Simple Habitat</label>

      <input type="radio" id="advanced" name="setup" value="advanced">
      <label for="advanced">Advanced Habitat</label>

      <br><br>

      <p>Care Activities You Do:</p>
      <input type="checkbox" id="feeding" name="activities" value="feeding">
      <label for="feeding">Feeding</label>

      <input type="checkbox" id="cleaning" name="activities" value="cleaning">
      <label for="cleaning">Cleaning</label>

      <input type="checkbox" id="handling" name="activities" value="handling">
      <label for="handling">Handling</label>

      <br><br>

      <label for="comments">Additional Comments:</label>
      <br>
      <textarea id="comments" name="comments" placeholder="Share your thoughts..." rows="4" cols="50"></textarea>

      <br><br>

      <button id="submit" type="submit">Submit Survey</button>

    </form>
  </main>

  <div data-include="components/footer.html"></div>
  <script src="scripts/HTMLInclude.min.js"></script>

</body>
</html>
